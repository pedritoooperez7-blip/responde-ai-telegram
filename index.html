<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efeff5" />
    <title>LiggaCuba</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="phone-shell">
      <header class="status-bar" aria-label="Estado del teléfono">
        <div class="time">2:55</div>
        <div class="status-icons" aria-hidden="true">
          <span class="signal signal-3"></span>
          <span class="signal signal-2"></span>
          <span class="signal signal-1"></span>
          <span class="wifi"></span>
          <span class="battery-wrap">
            <span class="battery-level"></span>
          </span>
          <span class="lte-badge">LTE</span>
        </div>
      </header>

      <div class="segmented-control" aria-label="Selector de módulo">
        <button class="segment active" type="button">Chat</button>
        <button class="segment" type="button">Insta Story</button>
      </div>

      <main class="app-body">
        <section class="panel upload-panel">
          <div class="section-head">
            <span class="panel-icon violet">💬</span>
            <h2>Imagen de la conversación</h2>
          </div>
          <p class="helper">Sube una captura de tu chat</p>

          <label class="upload-zone" for="chatImageInput">
            <input id="chatImageInput" type="file" accept="image/*" hidden />
            <div class="upload-inner">
              <span class="plus">＋</span>
              <span class="upload-text">Agregar</span>
            </div>
          </label>
        </section>

        <section class="panel mode-panel">
          <div class="section-head">
            <span class="panel-icon purple">😊</span>
            <h2>Modo de respuesta</h2>
          </div>
          <p class="helper">Elige el estilo de tu respuesta</p>

          <div class="mode-grid" aria-label="Modos de respuesta">
            <button class="mode-card" type="button" data-mode="gracioso">
              <span class="emoji">😎</span>
              <span class="mode-label">Gracioso</span>
            </button>

            <button class="mode-card selected" type="button" data-mode="coquetear">
              <span class="emoji">😊</span>
              <span class="mode-label">Coquetear</span>
            </button>

            <button class="mode-card" type="button" data-mode="provocativo">
              <span class="emoji">🔥</span>
              <span class="mode-label">Provocativo</span>
            </button>

            <button class="mode-card" type="button" data-mode="enamorar">
              <span class="emoji">😍</span>
              <span class="mode-label">Enamorar</span>
            </button>
          </div>

          <button class="special-option" type="button">
            <span class="option-emoji">
              <span class="mini-avatar">🧑‍🚀</span>
            </span>
            <span>Salvar Situación</span>
          </button>
        </section>

        <div class="usage-row">
          <div class="usage-pill">
            <span class="usage-icon">◔</span>
            <span>1 análisis restantes hoy</span>
          </div>
          <button class="update-link" type="button">Actualizar</button>
        </div>

        <button class="primary-action" type="button">Analizar con Liggo</button>

        <div class="bottom-tabs" aria-label="Navegación inferior">
          <button class="tab-home active" type="button">Home</button>
          <button class="tab-profile" type="button" aria-label="Perfil">👤</button>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
