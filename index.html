<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0eff4" />
    <title>LiggaCuba - Analiza y Responde</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="segmented-control" aria-label="Selector de módulo">
        <button class="segment active" type="button">Chat</button>
        <button class="segment" type="button">Insta Story</button>
      </div>

      <main class="app-body">
        <section class="panel upload-panel">
          <div class="section-head">
            <span class="panel-icon violet"><i class="fas fa-comment-dots"></i></span>
            <h2>Imagen de la conversación</h2>
          </div>
          <p class="helper">Sube una captura de tu chat</p>

          <label class="upload-zone" for="chatImageInput">
            <input id="chatImageInput" type="file" accept="image/*" hidden />
            <div class="upload-inner">
              <span class="plus">+</span>
              <span class="upload-text">Agregar</span>
            </div>
          </label>
        </section>

        <section class="panel mode-panel">
          <div class="section-head">
            <span class="panel-icon purple"><i class="fas fa-face-smile"></i></span>
            <h2>Modo de respuesta</h2>
          </div>
          <p class="helper">Elige el estilo de tu respuesta</p>

          <div class="mode-grid" aria-label="Modos de respuesta">
            <button class="mode-card" type="button" data-mode="gracioso">
              <span class="icon-wrapper"><i class="fas fa-face-grin-stars"></i></span>
              <span class="mode-label">Gracioso</span>
            </button>

            <button class="mode-card selected" type="button" data-mode="coquetear">
              <span class="icon-wrapper"><i class="fas fa-face-smile-wink"></i></span>
              <span class="mode-label">Coquetear</span>
            </button>

            <button class="mode-card" type="button" data-mode="provocativo">
              <span class="icon-wrapper"><i class="fas fa-fire"></i></span>
              <span class="mode-label">Provocativo</span>
            </button>

            <button class="mode-card" type="button" data-mode="enamorar">
              <span class="icon-wrapper"><i class="fas fa-heart"></i></span>
              <span class="mode-label">Enamorar</span>
            </button>
          </div>

          <button class="special-option" type="button">
            <span class="option-emoji"><i class="fas fa-shield-alt"></i></span>
            <span>Salvar Situación</span>
          </button>
        </section>

        <div class="usage-row">
          <div class="usage-pill">
            <span class="usage-icon"><i class="fas fa-clock"></i></span>
            <span id="usageText">1 análisis restantes hoy</span>
          </div>
          <button class="update-link" type="button" id="refreshUsage">Actualizar</button>
        </div>

        <button id="analyzeButton" class="primary-action" type="button">Analizar con Liggo</button>
        <div id="statusMessage" class="status-message" aria-live="polite"></div>

        <section id="resultPanel" class="result-panel hidden">
          <div class="result-block">
            <h3>Texto detectado</h3>
            <p id="ocrOutput">-</p>
          </div>

          <div class="result-block">
            <h3>Respuesta sugerida</h3>
            <p id="replyOutput">-</p>
          </div>

          <button id="copyResponse" class="copy-button" type="button">Copiar respuesta</button>
          <div id="copyStatus" class="copy-status" aria-live="polite"></div>
        </section>

        <div class="bottom-tabs" aria-label="Navegación inferior">
          <button class="tab-home active" type="button"><i class="fas fa-heart"></i>Home</button>
          <button class="tab-profile" type="button" aria-label="Perfil"><i class="fas fa-user"></i></button>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
