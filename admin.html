<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5fb"><title>Administración · LiggaCuba</title><link rel="stylesheet" href="/style.css"><style>
body{background:#f7f5fb}.admin-wrap{max-width:1000px;margin:auto;padding:22px 16px 50px}.admin-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}.admin-head .brand-mark{margin:0;flex:none}.admin-head h1{font-size:22px;margin:0}.admin-head p{margin:4px 0;color:#777184;font-size:12px}.admin-login,.admin-panel,.admin-card{background:white;border-radius:20px;padding:18px;box-shadow:0 8px 25px #2820440d;margin:12px 0}.admin-login{max-width:460px;margin:28px auto}.admin-input{box-sizing:border-box;margin:6px 0 12px}.admin-btn{background:#4d35ff;color:white;padding:11px 14px;border-radius:12px;font-weight:800;border:0;cursor:pointer}.admin-btn.secondary{background:#f0edff;color:#4d35ff}.admin-btn.danger{background:#fff0f2;color:#b4233c}.admin-nav{display:flex;gap:8px;overflow:auto;margin:12px 0}.admin-nav button{white-space:nowrap;background:white;border:1px solid #e7e2f1;padding:10px 13px;border-radius:12px;font-weight:800}.admin-nav button.active{background:#4d35ff;color:white}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.admin-stat{background:#f8f7fc;border-radius:15px;padding:14px}.admin-stat b{font-size:23px;display:block}.admin-stat span{font-size:11px;color:#777184}.admin-stat.warn{background:#fff8e6}.admin-stat.warn b{color:#92570a}.admin-stat.good{background:#edfdf4}.admin-stat.good b{color:#166534}.admin-stat.bad{background:#fff0f2}.admin-stat.bad b{color:#b4233c}.admin-table{width:100%;border-collapse:collapse;font-size:12px}.admin-table th,.admin-table td{text-align:left;padding:10px 7px;border-bottom:1px solid #eeeaf5;vertical-align:top;overflow-wrap:anywhere}.admin-table-wrap{overflow:auto}.admin-row{padding:12px 0;border-bottom:1px solid #eeeaf5}.admin-row:last-child{border:0}.admin-small{font-size:11px;color:#777184}.admin-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.admin-actions .admin-btn{font-size:11px;padding:8px 10px}.hidden{display:none!important}.admin-error{color:#b4233c;font-size:12px;min-height:18px}@media(max-width:500px){.admin-wrap{padding:15px 12px}.admin-table{min-width:650px}}
</style></head><body><div class="admin-wrap"><header class="admin-head"><div class="brand-mark">LC</div><div><h1>LiggaCuba · Administración</h1><p>Gestión segura de usuarios, Premium y pagos</p><a href="/" style="font-size:12px">← Volver a LiggaCuba</a></div></header>
<section id="loginBox" class="admin-login"><h2>Acceso de administrador</h2><p class="admin-small">Usa ADMIN_KEY de Railway para entrar por primera vez o las credenciales de un administrador creado.</p><label>Usuario (administradores secundarios)</label><input id="loginUser" class="admin-input" autocomplete="username" placeholder="Usuario"><label>Contraseña</label><input id="loginPass" class="admin-input" type="password" autocomplete="current-password" placeholder="Contraseña"><label>ADMIN_KEY principal (dejar vacío si usas usuario)</label><input id="masterKey" class="admin-input" type="password" autocomplete="current-password" placeholder="Clave principal de Railway"><button id="loginBtn" class="admin-btn">Entrar</button><p id="loginError" class="admin-error"></p></section>
<section id="panel" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b id="whoami">Administrador</b><div class="admin-small">Las acciones importantes quedan registradas.</div></div><button id="logout" class="admin-btn secondary">Cerrar sesión</button></div><nav class="admin-nav"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="users">Usuarios / Premium</button><button data-tab="payments">Pagos</button><button data-tab="admins">Administradores</button><button data-tab="audit">Historial</button><button data-tab="ai-monitor">Monitor de IA</button><button data-tab="providers">Proveedores IA</button><button data-tab="dating">Citas</button><button data-tab="ads">Anuncios</button><button data-tab="pricing">Precios</button></nav><div id="content"></div></section></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let token=sessionStorage.getItem('lc_admin_token')||'';if(!token&&localStorage.getItem('lc_admin_token')){token=localStorage.getItem('lc_admin_token');sessionStorage.setItem('lc_admin_token',token)}localStorage.removeItem('lc_admin_token');let perms=[];const fmtCubaDate=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('es-CU',{timeZone:'America/Havana',dateStyle:'short',timeStyle:'medium'}).format(d)};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(path,{...opts,headers});const d=await r.json().catch(()=>({detail:'Respuesta inválida'}));if(!r.ok)throw Error(d.detail||'Error');return d}
async function login(){const err=$('#loginError');err.textContent='';try{const master=$('#masterKey').value.trim();const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#loginUser').value.trim(),password:$('#loginPass').value,master_key:master})});token=d.token;perms=d.permissions||[];sessionStorage.setItem('lc_admin_token',token);syncAdminNav();$('#masterKey').value='';sessionStorage.removeItem('lc_master_key');$('#loginBox').classList.add('hidden');$('#panel').classList.remove('hidden');$('#whoami').textContent=d.is_owner?'Administrador principal':d.username;await showTab('dashboard')}catch(e){err.textContent=e.message}}
function can(p){return perms.includes(p)}
function syncAdminNav(){$$('.admin-nav button').forEach(b=>{const need={users:'users',payments:'payments',admins:'admins',audit:'audit',dashboard:'stats','ai-monitor':'ai_analytics',providers:'settings',dating:'dating',ads:'ads',pricing:'settings'}[b.dataset.tab];b.classList.toggle('hidden',!!need&&!can(need))})}
async function showTab(tab){$$('.admin-nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const c=$('#content');c.innerHTML='<div class="admin-card">Cargando…</div>';try{if(tab==='dashboard'){const d=await api('/api/admin/stats');
const sparkline=(data,color='#4d35ff')=>{if(!data||!data.length)return'<span class="admin-small">Sin datos aún</span>';const max=Math.max(...data.map(x=>x.count),1);const w=280,h=60,pad=4;const pts=data.map((x,i)=>`${pad+i*(w-pad*2)/(data.length-1||1)},${h-pad-(x.count/max)*(h-pad*2)}`).join(' ');const lastVal=data[data.length-1]?.count??0;const firstVal=data[0]?.count??0;const trend=lastVal>=firstVal?'↑':'↓';const trendColor=lastVal>=firstVal?'#22c55e':'#ef4444';return`<div style="position:relative"><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:60px"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pad+(data.length-1)*(w-pad*2)/(data.length-1||1)}" cy="${h-pad-(lastVal/max)*(h-pad*2)}" r="4" fill="${color}"/></svg><div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:2px"><span>${data[0]?.day?.slice(5)||''}</span><span style="color:${trendColor};font-weight:800">${trend} ${lastVal}</span><span>${data[data.length-1]?.day?.slice(5)||''}</span></div></div>`};
const convRate=d.conversion?.rate_pct??'—';const convLast7=d.conversion?.last_7d??0;const retRate=d.retention_7d?.rate_pct??'—';const retCohort=d.retention_7d?.cohort_size??0;
c.innerHTML=`<h2>Dashboard</h2>
<div class="admin-grid">
  <div class="admin-stat"><b>${esc(d.total_users)}</b><span>Usuarios registrados</span></div>
  <div class="admin-stat"><b>${esc(d.premium_users)}</b><span>Premium activo</span></div>
  <div class="admin-stat"><b>${esc(d.today_usage)}</b><span>Uso de hoy</span></div>
  <div class="admin-stat warn"><b>${esc(d.pending_payments)}</b><span>Pagos pendientes</span></div>
  <div class="admin-stat good"><b>${convRate}%</b><span>Conversión free→premium</span></div>
  <div class="admin-stat ${typeof retRate==='number'&&retRate>=30?'good':typeof retRate==='number'&&retRate<15?'bad':''}"><b>${retRate}%</b><span>Retención 7 días</span></div>
</div>
<div class="admin-card">
  <b>Nuevos usuarios — últimos 14 días</b>
  <p class="admin-small" style="margin:2px 0 8px">Conversiones últimos 7 días: <b style="color:#4d35ff">${convLast7}</b></p>
  ${sparkline(d.new_users_by_day,'#4d35ff')}
</div>
<div class="admin-card">
  <b>Actividad diaria — últimos 14 días</b>
  <p class="admin-small" style="margin:2px 0 8px">Análisis de IA realizados por día</p>
  ${sparkline(d.usage_by_day,'#22c55e')}
</div>
<div class="admin-card">
  <b>Conversión free → premium</b>
  <p class="admin-small">De ${esc(d.conversion?.eligible_users??0)} usuarios elegibles, <b>${esc(d.conversion?.ever_premium??0)}</b> han pagado alguna vez → <b style="color:#4d35ff">${convRate}%</b></p>
</div>
<div class="admin-card">
  <b>Retención a 7 días</b>
  <p class="admin-small">Cohorte (registrados hace 7-14 días): <b>${esc(retCohort)}</b> usuarios. Volvieron a usar en los últimos 7 días: <b>${esc(d.retention_7d?.retained??0)}</b> → <b style="color:${typeof retRate==='number'&&retRate>=30?'#22c55e':typeof retRate==='number'&&retRate<15?'#ef4444':'#f59e0b'}">${retRate}%</b>${retCohort<10?' <span style=\'color:#aaa;font-size:11px\'>(cohorte pequeña, poco significativo)</span>':''}</p>
</div>
${d.dating?`<div class="admin-card"><b>Citas</b><div class="admin-grid" style="margin-top:8px"><div class="admin-stat"><b>${esc(d.dating.active_profiles)}</b><span>Perfiles activos</span></div><div class="admin-stat"><b>${esc(d.dating.active_matches)}</b><span>Matches activos</span></div><div class="admin-stat warn"><b>${esc(d.dating.pending_photos)}</b><span>Fotos pendientes</span></div></div></div>`:''}
<div class="admin-card"><b>Consejo de seguridad</b><p class="admin-small">Verifica el ingreso real antes de aprobar una transferencia manualmente.</p></div>`}
else if(tab==='users'){const d=await api('/api/admin/users');c.innerHTML=`<h2>Usuarios y Premium</h2><input id="userSearch" class="admin-input" placeholder="Buscar por ID, nombre o username"><div id="userRows"></div>`;const draw=items=>$('#userRows').innerHTML=items.map(u=>`<div class="admin-row"><b>${esc(u.first_name||u.username||'Usuario')} · ${esc(u.user_id)}</b><div class="admin-small">@${esc(u.username||'—')} · Teléfono: ${esc(u.payment_phone||'—')}<br>Premium: ${u.premium?'Activo':'Inactivo'} · Vence: ${esc(fmtCubaDate(u.premium_until))}${u.banned?`<br><b style="color:#c0392b">BANEADO</b> desde ${esc(fmtCubaDate(u.banned_at))} · sus datos se borran 48 h después del baneo`:''}</div>${can('premium')?`<div class="admin-actions"><button class="admin-btn" data-prem="grant" data-uid="${esc(u.user_id)}">Activar 7 días</button><button class="admin-btn secondary" data-prem="extend" data-days="7" data-uid="${esc(u.user_id)}">Extender 7 días</button><button class="admin-btn secondary" data-prem="extend" data-days="365" data-uid="${esc(u.user_id)}">Extender 1 año</button><button class="admin-btn danger" data-prem="revoke" data-uid="${esc(u.user_id)}">Retirar Premium</button></div>`:''}${can('users')?`<div class="admin-actions">${u.banned?`<button class="admin-btn" data-ban="unban" data-uid="${esc(u.user_id)}">Desbanear</button>`:`<button class="admin-btn danger" data-ban="ban" data-uid="${esc(u.user_id)}">Banear</button>`}<button class="admin-btn danger" data-ban="delete" data-uid="${esc(u.user_id)}">Borrar usuario y datos</button></div>`:''}</div>`).join('')||'<p>Sin usuarios.</p>';draw(d.items);$('#userSearch').oninput=()=>draw(d.items.filter(u=>[u.user_id,u.username,u.first_name].some(v=>String(v||'').toLowerCase().includes($('#userSearch').value.toLowerCase()))));$$('[data-ban]').forEach(b=>b.onclick=async()=>{const uid=b.dataset.uid,act=b.dataset.ban,base=`/api/admin/users/${encodeURIComponent(uid)}`;try{if(act==='ban'){const reason=prompt('Motivo del baneo (opcional).\nEl usuario pierde el acceso ahora y, si no lo desbaneas en 48 horas, sus datos se borran.');if(reason===null)return;await api(base+'/ban',{method:'POST',body:JSON.stringify({reason})});alert('Usuario baneado')}else if(act==='unban'){if(!confirm(`¿Desbanear a ${uid}?`))return;await api(base+'/unban',{method:'POST'});alert('Usuario desbaneado')}else{if(!confirm(`¿Borrar a ${uid} y TODOS sus datos (perfil de Citas, fotos, historial, anuncio)? Esto no se puede deshacer.`))return;await api(base,{method:'DELETE'});alert('Usuario borrado')}await showTab('users')}catch(e){alert(e.message)}});$$('[data-prem]').forEach(b=>b.onclick=async()=>{if(!confirm(`¿Confirmas ${b.dataset.prem} Premium para ${b.dataset.uid}?`))return;try{await api('/api/admin/premium',{method:'POST',body:JSON.stringify({user_id:b.dataset.uid,action:b.dataset.prem,days:Number(b.dataset.days||7)})});alert('Premium actualizado');await showTab('users')}catch(e){alert(e.message)}})}
else if(tab==='payments'){const d=await api('/api/admin/payments');c.innerHTML=`<h2>Pagos recientes</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Operación</th><th>Usuario</th><th>Método</th><th>Importe</th><th>Estado</th><th>Comprobante / archivo</th><th>Fecha</th><th>Acción</th></tr></thead><tbody>${d.items.map(p=>`<tr><td>${esc(p.operation_id)}</td><td>${esc(p.user_id)}</td><td>${esc(p.payment_method||'—')}</td><td>${esc(p.amount)}</td><td>${esc(p.status)}</td><td>${p.archive_status==='sent'?`Archivado · chat ${esc(p.archive_chat_id||'—')} · mensaje ${esc(p.archive_message_id||'—')}`:p.archive_status==='queued'||p.archive_status==='retrying'?`Pendiente de archivo · intentos ${esc(p.archive_attempts||0)}${p.archive_last_error?`<br>Error: ${esc(p.archive_last_error)}`:''}`:`${p.proof_text?'Texto disponible':''}${p.has_proof_image?' · Imagen disponible':''}${!p.proof_text&&!p.has_proof_image?'Sin copia local':''}`}${p.proof_text||p.has_proof_image?`<br><button class="admin-btn secondary" data-proof="${esc(p.operation_id)}">Ver comprobante</button>`:''}</td><td>${esc(fmtCubaDate(p.created_at))}</td><td>${can('payments')&&['pending','proof_submitted'].includes(p.status)?`<button class="admin-btn" data-verify="${esc(p.operation_id)}">Verificar</button><button class="admin-btn danger" data-reject="${esc(p.operation_id)}">Rechazar</button>`:'—'}</td></tr>`).join('')}</tbody></table></div><p class="admin-small">Verificar un pago concede el Premium del plan asociado. Confirma primero que el dinero fue recibido.</p>`;$$('[data-verify]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Confirmaste el ingreso real del dinero y deseas activar Premium?'))return;try{await api('/api/admin/payments/verify',{method:'POST',body:JSON.stringify({operation_id:b.dataset.verify,user_id:''})});alert('Pago verificado');showTab('payments')}catch(e){alert(e.message)}});$$('[data-reject]').forEach(b=>b.onclick=async()=>{const reason=prompt('Motivo del rechazo (opcional):')??null;if(reason===null)return;try{await api('/api/admin/payments/reject',{method:'POST',body:JSON.stringify({operation_id:b.dataset.reject,action:'reject',reason})});showTab('payments')}catch(e){alert(e.message)}});$$('[data-proof]').forEach(b=>b.onclick=async()=>{try{const proof=await api('/api/admin/payments/'+encodeURIComponent(b.dataset.proof)+'/proof');const modal=document.createElement('div');modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';const body=document.createElement('div');body.style.cssText='background:#fff;color:#222;border-radius:16px;padding:18px;max-width:700px;width:100%;max-height:90vh;overflow:auto';const close=document.createElement('button');close.className='admin-btn secondary';close.textContent='Cerrar';close.onclick=()=>modal.remove();body.appendChild(close);if(proof.proof_text){const text=document.createElement('pre');text.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0';text.textContent=proof.proof_text;body.appendChild(text)}if(proof.proof_image){const img=document.createElement('img');img.src=proof.proof_image;img.alt='Comprobante de pago';img.style.cssText='max-width:100%;height:auto;border-radius:10px';body.appendChild(img)}modal.appendChild(body);modal.onclick=e=>{if(e.target===modal)modal.remove()};document.body.appendChild(modal)}catch(e){alert(e.message||'No se pudo cargar el comprobante')}})}
else if(tab==='admins'){if(!can('admins')){c.innerHTML='<div class="admin-card">No tienes permiso para administrar cuentas.</div>';return}const d=await api('/api/admin/admins');c.innerHTML=`<h2>Administradores</h2><div class="admin-card"><h3>Crear administrador</h3><label>Usuario</label><input id="newUser" class="admin-input" placeholder="usuario"><label>Contraseña (mínimo 10 caracteres)</label><input id="newPass" class="admin-input" type="password"><p><label><input type="checkbox" value="users" class="perm" checked> Usuarios</label> <label><input type="checkbox" value="premium" class="perm" checked> Premium</label> <label><input type="checkbox" value="payments" class="perm"> Pagos</label> <label><input type="checkbox" value="stats" class="perm"> Estadísticas</label> <label><input type="checkbox" value="audit" class="perm"> Historial</label> <label><input type="checkbox" value="ai_analytics" class="perm"> Monitor de IA</label> <label><input type="checkbox" value="dating" class="perm"> Citas (moderación)</label> <label><input type="checkbox" value="ads" class="perm"> Anuncios</label></p><button id="createAdmin" class="admin-btn">Crear administrador</button></div><h3>Administradores existentes</h3>${d.items.map(a=>`<div class="admin-row"><b>${esc(a.username)}</b><div class="admin-small">Permisos: ${esc(a.permissions.join(', '))} · ${a.is_active?'Activo':'Desactivado'}</div>${a.is_active?`<button class="admin-btn danger" data-disable="${esc(a.username)}">Desactivar</button>`:''}</div>`).join('')}`;$('#createAdmin').onclick=async()=>{try{const permissions=$$('.perm:checked').map(x=>x.value);await api('/api/admin/admins',{method:'POST',body:JSON.stringify({username:$('#newUser').value,password:$('#newPass').value,permissions})});alert('Administrador creado');showTab('admins')}catch(e){alert(e.message)}};$$('[data-disable]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Desactivar este administrador?'))return;try{await api('/api/admin/admins/status',{method:'POST',body:JSON.stringify({username:b.dataset.disable,is_active:false})});showTab('admins')}catch(e){alert(e.message)}})}
else if(tab==='dating'){if(!can('dating')){c.innerHTML='<div class="admin-card">No tienes permiso para moderar Citas.</div>';return}const d=await api('/api/admin/dating/overview');const s=d.stats;c.innerHTML=`<h2>Citas · moderación</h2><div class="admin-grid">${[['Perfiles',s.profiles],['Activos',s.active_profiles],['Fotos por revisar',s.pending_photos],['Reportes abiertos',s.open_reports],['Matches',s.matches]].map(x=>`<div class="admin-stat"><b>${esc(x[1])}</b><span>${x[0]}</span></div>`).join('')}</div><h3>Fotos pendientes</h3>${d.photos.length?d.photos.map(p=>`<div class="admin-card"><img src="${esc(p.url)}" alt="" style="max-width:220px;max-height:280px;border-radius:12px;display:block;margin-bottom:8px"><div class="admin-small">${esc(p.display_name)} · usuario ${esc(p.user_id)} · ${fmtCubaDate(p.created_at)}</div><button class="admin-btn" data-photo="${esc(p.id)}" data-act="approve">Aprobar</button> <button class="admin-btn secondary" data-photo="${esc(p.id)}" data-act="reject">Rechazar</button></div>`).join(''):'<div class="admin-card">No hay fotos pendientes.</div>'}<h3>Reportes abiertos</h3>${d.reports.length?d.reports.map(r=>`<div class="admin-card"><b>${esc(r.display_name||'Perfil eliminado')}</b> <span class="admin-small">(${esc(r.profile_status||'—')})</span><div class="admin-small">Motivo: ${esc(r.reason)} · reportó ${esc(r.reporter_id)} · ${fmtCubaDate(r.created_at)}</div>${r.details?`<p>${esc(r.details)}</p>`:''}<button class="admin-btn" data-report="${esc(r.id)}" data-act="suspend">Suspender perfil</button> <button class="admin-btn secondary" data-report="${esc(r.id)}" data-act="dismiss">Descartar</button></div>`).join(''):'<div class="admin-card">No hay reportes abiertos.</div>'}`;$$('[data-photo]').forEach(b=>b.onclick=async()=>{let reason='';if(b.dataset.act==='reject'){reason=prompt('Motivo del rechazo (se muestra al usuario):','Foto no permitida')||'';if(!reason)return}try{await api('/api/admin/dating/photos/'+encodeURIComponent(b.dataset.photo)+'/review',{method:'POST',body:JSON.stringify({action:b.dataset.act,reason})});showTab('dating')}catch(e){alert(e.message)}});$$('[data-report]').forEach(b=>b.onclick=async()=>{if(b.dataset.act==='suspend'&&!confirm('¿Suspender este perfil de Citas?'))return;try{await api('/api/admin/dating/reports/'+encodeURIComponent(b.dataset.report)+'/resolve',{method:'POST',body:JSON.stringify({action:b.dataset.act})});showTab('dating')}catch(e){alert(e.message)}})}
else if(tab==='ai-monitor'){
if(!can('ai_analytics')){c.innerHTML='<div class="admin-card">No tienes permiso para consultar el monitor de IA.</div>';return}
const d=await api('/api/admin/ai-monitor'),s=d.summary;
const stat=(label,value)=>`<div class="admin-stat"><b>${esc(value)}</b><span>${label}</span></div>`;
const pct=(n,total)=>total?Math.round(n*100/total):0;
c.innerHTML=`<h2>Monitor de IA</h2><p class="admin-small">${esc(d.quality_note)}</p>
<div class="admin-grid">${stat('Generaciones de hoy',s.today_events)}${stat('Éxitos',s.successes)}${stat('Errores',s.failures)}${stat('Tasa de éxito',s.success_rate+'%')}${stat('Usuarios activos hoy',s.unique_users)}${stat('Latencia media',s.avg_latency_ms+' ms')}${stat('Calidad estimada media',s.avg_quality+'/100')}</div>

document.addEventListener('DOMContentLoaded', () => {
  document.addEventListener('click', e => {
    if (e.target.id === 'adImgUploadBtn') document.getElementById('adImgFile')?.click();
  });
  document.addEventListener('change', async e => {
    if (e.target.id !== 'adImgFile') return;
    const file = e.target.files?.[0];
    if (!file) return;
    const btn = document.getElementById('adImgUploadBtn');
    const status = document.getElementById('adImgUploadStatus');
    const preview = document.getElementById('adImgPreview');
    if (btn) btn.disabled = true;
    if (status) status.textContent = 'Subiendo…';
    try {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
      const d = await api('/api/ads/upload-image', { method: 'POST', body: JSON.stringify({ image: b64 }) });
      const inp = document.getElementById('adImg');
      if (inp) inp.value = d.url;
      if (preview) { preview.innerHTML = `<img src="${esc(d.url)}" style="max-height:120px;border-radius:10px;display:block">`; }
      if (status) { status.textContent = '✓ Subida'; setTimeout(() => { if (status) status.textContent = ''; }, 3000); }
    } catch (err) { if (status) status.textContent = err.message; }
    finally { if (btn) btn.disabled = false; }
  });
});
