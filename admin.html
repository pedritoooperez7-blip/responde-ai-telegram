const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let token=sessionStorage.getItem('lc_admin_token')||'';if(!token&&localStorage.getItem('lc_admin_token')){token=localStorage.getItem('lc_admin_token');sessionStorage.setItem('lc_admin_token',token)}localStorage.removeItem('lc_admin_token');let perms=[];const fmtCubaDate=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('es-CU',{timeZone:'America/Havana',dateStyle:'short',timeStyle:'medium'}).format(d)};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(path,{...opts,headers});const d=await r.json().catch(()=>({detail:'Respuesta inválida'}));if(!r.ok)throw Error(d.detail||'Error');return d}
async function login(){const err=$('#loginError');err.textContent='';try{const master=$('#masterKey').value.trim();const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#loginUser').value.trim(),password:$('#loginPass').value,master_key:master})});token=d.token;perms=d.permissions||[];sessionStorage.setItem('lc_admin_token',token);syncAdminNav();$('#masterKey').value='';sessionStorage.removeItem('lc_master_key');$('#loginBox').classList.add('hidden');$('#panel').classList.remove('hidden');$('#whoami').textContent=d.is_owner?'Administrador principal':d.username;await showTab('dashboard')}catch(e){err.textContent=e.message}}

async function showTab(tab){if(typeof window._bcTeardown==='function'){try{window._bcTeardown()}catch(e){}} $$('.admin-nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const c=$('#content');c.innerHTML='<div class="admin-card">Cargando…</div>';try{if(tab==='dashboard'){const d=await api('/api/admin/stats');
const sparkline=(data,color='#4d35ff')=>{if(!data||!data.length)return'<span class="admin-small">Sin datos aún</span>';const max=Math.max(...data.map(x=>x.count),1);const w=280,h=60,pad=4;const pts=data.map((x,i)=>`${pad+i*(w-pad*2)/(data.length-1||1)},${h-pad-(x.count/max)*(h-pad*2)}`).join(' ');const lastVal=data[data.length-1]?.count??0;const firstVal=data[0]?.count??0;const trend=lastVal>=firstVal?'↑':'↓';const trendColor=lastVal>=firstVal?'#22c55e':'#ef4444';return`<div style="position:relative"><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:60px"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pad+(data.length-1)*(w-pad*2)/(data.length-1||1)}" cy="${h-pad-(lastVal/max)*(h-pad*2)}" r="4" fill="${color}"/></svg><div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:2px"><span>${data[0]?.day?.slice(5)||''}</span><span style="color:${trendColor};font-weight:800">${trend} ${lastVal}</span><span>${data[data.length-1]?.day?.slice(5)||''}</span></div></div>`};

else if(tab==='payments'){const d=await api('/api/admin/payments');c.innerHTML=`<h2>Pagos recientes</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Operación</th><th>Usuario</th><th>Método</th><th>Importe</th><th>Estado</th><th>Comprobante / archivo</th><th>Fecha</th><th>Acción</th></tr></thead><tbody>${d.items.map(p=>`<tr><td>${esc(p.operation_id)}</td><td>${esc(p.user_id)}</td><td>${esc(p.payment_method||'—')}</td><td>${esc(p.amount)}</td><td>${esc(p.status)}</td><td>${p.archive_status==='sent'?`Archivado · chat ${esc(p.archive_chat_id||'—')} · mensaje ${esc(p.archive_message_id||'—')}`:p.archive_status==='queued'||p.archive_status==='retrying'?`Pendiente de archivo · intentos ${esc(p.archive_attempts||0)}${p.archive_last_error?`<br>Error: ${esc(p.archive_last_error)}`:''}`:`${p.proof_text?'Texto disponible':''}${p.has_proof_image?' · Imagen disponible':''}${!p.proof_text&&!p.has_proof_image?'Sin copia local':''}`}${p.proof_text||p.has_proof_image?`<br><button class="admin-btn secondary" data-proof="${esc(p.operation_id)}">Ver comprobante</button>`:''}</td><td>${esc(fmtCubaDate(p.created_at))}</td><td>${can('payments')&&['pending','proof_submitted'].includes(p.status)?`<button class="admin-btn" data-verify="${esc(p.operation_id)}">Verificar</button><button class="admin-btn danger" data-reject="${esc(p.operation_id)}">Rechazar</button>`:'—'}</td></tr>`).join('')}</tbody></table></div><p class="admin-small">Verificar un pago concede el Premium del plan asociado. Confirma primero que el dinero fue recibido.</p>`;$$('[data-verify]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Confirmaste el ingreso real del dinero y deseas activar Premium?'))return;try{await api('/api/admin/payments/verify',{method:'POST',body:JSON.stringify({operation_id:b.dataset.verify,user_id:''})});alert('Pago verificado');showTab('payments')}catch(e){alert(e.message)}});$$('[data-reject]').forEach(b=>b.onclick=async()=>{const reason=prompt('Motivo del rechazo (opcional):')??null;if(reason===null)return;try{await api('/api/admin/payments/reject',{method:'POST',body:JSON.stringify({operation_id:b.dataset.reject,action:'reject',reason})});showTab('payments')}catch(e){alert(e.message)}});$$('[data-proof]').forEach(b=>b.onclick=async()=>{try{const proof=await api('/api/admin/payments/'+encodeURIComponent(b.dataset.proof)+'/proof');const modal=document.createElement('div');modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';const body=document.createElement('div');body.style.cssText='background:#fff;color:#222;border-radius:16px;padding:18px;max-width:700px;width:100%;max-height:90vh;overflow:auto';const close=document.createElement('button');close.className='admin-btn secondary';close.textContent='Cerrar';close.onclick=()=>modal.remove();body.appendChild(close);if(proof.proof_text){const text=document.createElement('pre');text.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0';text.textContent=proof.proof_text;body.appendChild(text)}if(proof.proof_image){const img=document.createElement('img');img.src=proof.proof_image;img.alt='Comprobante de pago';img.style.cssText='max-width:100%;height:auto;border-radius:10px';body.appendChild(img)}modal.appendChild(body);modal.onclick=e=>{if(e.target===modal)modal.remove()};document.body.appendChild(modal)}catch(e){alert(e.message||'No se pudo cargar el comprobante')}})}
else if(tab==='admins'){if(!can('admins')){c.innerHTML='<div class="admin-card">No tienes permiso para administrar cuentas.</div>';return}const d=await api('/api/admin/admins');c.innerHTML=`<h2>Administradores</h2><div class="admin-card"><h3>Crear administrador</h3><label>Usuario</label><input id="newUser" class="admin-input" placeholder="usuario"><label>Contraseña (mínimo 10 caracteres)</label><input id="newPass" class="admin-input" type="password"><p><label><input type="checkbox" value="users" class="perm" checked> Usuarios</label> <label><input type="checkbox" value="premium" class="perm" checked> Premium</label> <label><input type="checkbox" value="payments" class="perm"> Pagos</label> <label><input type="checkbox" value="stats" class="perm"> Estadísticas</label> <label><input type="checkbox" value="audit" class="perm"> Historial</label> <label><input type="checkbox" value="ai_analytics" class="perm"> Monitor de IA</label> <label><input type="checkbox" value="dating" class="perm"> Citas (moderación)</label> <label><input type="checkbox" value="ads" class="perm"> Anuncios</label></p><button id="createAdmin" class="admin-btn">Crear administrador</button></div><h3>Administradores existentes</h3>${d.items.map(a=>`<div class="admin-row"><b>${esc(a.username)}</b><div class="admin-small">Permisos: ${esc(a.permissions.join(', '))} · ${a.is_active?'Activo':'Desactivado'}</div>${a.is_active?`<button class="admin-btn danger" data-disable="${esc(a.username)}">Desactivar</button>`:''}</div>`).join('')}`;$('#createAdmin').onclick=async()=>{try{const permissions=$$('.perm:checked').map(x=>x.value);await api('/api/admin/admins',{method:'POST',body:JSON.stringify({username:$('#newUser').value,password:$('#newPass').value,permissions})});alert('Administrador creado');showTab('admins')}catch(e){alert(e.message)}};$$('[data-disable]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Desactivar este administrador?'))return;try{await api('/api/admin/admins/status',{method:'POST',body:JSO const INTEREST_OPTS=['música','deportes','viajes','cocina','cine','lectura','baile','fotografía','arte','gaming','tecnología','naturaleza','moda','fitness','animales'];

  const ints=bot?JSON.parse(bot.interests||'[]'):[];
  const sel=(f,opts,def='')=>`<select name="${f}">${opts.map(o=>`<option value="${esc(o)}"${(bot?bot[f]:def)===o?' selected':''}>${esc(o)}</option>`).join('')}</select>`;

  <div><label>WhatsApp</label><input name="whatsapp" value="${v('whatsapp')}" placeholder="+5355123456"></div>
  <div><label>Estado</label><select name="status"><option value="active"${v('status','active')==='active'?' selected':''}>Activo</option><option value="inactive"${v('status')==='inactive'?' selected':''}>Inactivo</option><option value="suspended"${v('status')==='suspended'?' selected':''}>Suspendido</option></select></div>

function _dtCollectForm(){
  const form=document.getElementById('bot-form-fields');
  if(!form)return null;
  const g=n=>form.querySelector(`[name="${n}"]`)?.value?.trim()||'';
  const interests=JSON.parse(document.getElementById('interests-json-hidden')?.value||'[]');
  return{display_name:g('display_name'),birth_date:g('birth_date'),gender:g('gender'),looking_for:g('looking_for'),province:g('province'),municipality:g('municipality'),bio:g('bio'),min_age:parseInt(g('min_age')||'18'),max_age:parseInt(g('max_age')||'99'),whatsapp:g('whatsapp'),status:g('status'),bot_notes:g('bot_notes'),interests,visible:true};
}

async function _dtLoadBots(dc){
  const data=await api('/api/admin/dating/bots?limit=200');
  const bots=data.bots||[];
  let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">🤖 Gestión de Bots de Citas</h3><button class="admin-btn" id="btn-new-bot">＋ Crear bot</button></div><div id="bot-form-wrap"></div><div id="bot-list-wrap">`;
  if(!bots.length){html+='<div class="admin-card" style="color:#888">No hay bots de citas. Crea el primero con el botón de arriba.</div>'}
  else{bots.forEach(bot=>{
    const badge=`<span class="bot-status-badge ${esc(bot.status||'active')}">${esc(bot.status||'active')}</span>`;
    const ints=JSON.parse(bot.interests||'[]').join(', ')||'—';
    html+=`<div class="bot-card" id="bc-${esc(bot.user_id)}">
      <div class="bot-card-header"><div><b>${esc(bot.display_name)}</b> ${badge}<div class="admin-small" style="margin-top:3px">${esc(bot.gender)} · ${esc(bot.province)} · ${esc(bot.birth_date)} · busca: ${esc(bot.looking_for)}</div>${bot.bio?`<div class="admin-small" style="margin-top:2px;color:#555">${esc(bot.bio)}</div>`:''}<div class="admin-small" style="margin-top:2px">Intereses: ${esc(ints)}</div>${bot.bot_notes?`<div class="admin-small" style="color:#a37c00;margin-top:2px">📌 ${esc(bot.bot_notes)}</div>`:''}</div><div class="admin-actions" style="flex-direction:column;align-items:flex-end"><button class="admin-btn secondary" data-bot-edit="${esc(bot.user_id)}">✏️ Editar</button><button class="admin-btn secondary" data-bot-toggle="${esc(bot.user_id)}" data-bot-status="${esc(bot.status||'active')}">${(bot.status==='active')?'⏸ Desactivar':'▶ Activar'}</button><button class="admin-btn danger" data-bot-del="${esc(bot.user_id)}" data-bot-name="${esc(bot.display_name)}">🗑 Eliminar</button></div></div>
      <div class="bot-photos-row" id="bph-${esc(bot.user_id)}"><span class="admin-small" style="align-self:center;color:#aaa">Cargando fotos…</span></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="admin-btn secondary" style="cursor:pointer;font-size:11px">📷 Agregar foto<input type="file" accept="image/jpeg,image/png,image/webp" style="display:none" data-bot-upload="${esc(bot.user_id)}"></label><span class="admin-small" style="color:#888">JPG/PNG/WEBP · máx. 8 MB · se aprueba automáticamente</span></div>
    </div>`;
  })}
  html+='</div>';
  dc.innerHTML=html;
  // Cargar fotos de cada bot
  bots.forEach(bot=>{_dtLoadBotPhotos(bot.user_id)});
  // Botón nuevo bot
  document.getElementById('btn-new-bot').onclick=()=>{_dtShowBotForm(null)};
  // Acciones de cada bot
  dc.querySelectorAll('[data-bot-edit]').forEach(b=>b.onclick=async()=>{
    const botData=bots.find(x=>x.user_id===b.dataset.botEdit);
    _dtShowBotForm(botData);
  });
  dc.querySelectorAll('[data-bot-toggle]').forEach(b=>b.onclick=async()=>{
    const uid=b.dataset.botToggle;
    const cur=b.dataset.botStatus;
    const next=cur==='active'?'inactive':'active';
    if(!confirm(`¿${next==='active'?'Activar':'Desactivar'} el bot?`))return;
    try{await api('/api/admin/dating/bots/'+encodeURIComponent(uid),{method:'PUT',body:JSON.stringify({status:next})});_dtLoadSub()}catch(e){alert(e.message)}
  });
  dc.querySelectorAll('[data-bot-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm(`¿Eliminar al bot "${b.dataset.botName}" y TODOS sus datos (matches, mensajes, fotos)? Esto no se puede deshacer.`))return;
    try{await api('/api/admin/dating/bots/'+encodeURIComponent(b.dataset.botDel),{method:'DELETE'});_dtLoadSub()}catch(e){alert(e.message)}
  });
  dc.querySelectorAll('[data-bot-upload]').forEach(input=>input.onchange=async()=>{
    const file=input.files?.[0];if(!file)return;
    const uid=input.dataset.botUpload;
    if(file.size>8*1024*1024){alert('La foto supera los 8 MB.');input.value='';return}
    const reader=new FileReader();
    reader.onload=async()=>{
      try{
        await api('/api/admin/dating/bots/'+encodeURIComponent(uid)+'/photos',{method:'POST',body:JSON.stringify({image:reader.result})});
        _dtLoadBotPhotos(uid);
      }catch(e){alert('Error subiendo foto: '+e.message)}
      input.value='';
    };
    reader.readAsDataURL(file);
  });
}

async function _dtLoadBotPhotos(uid){
  const wrap=document.getElementById('bph-'+uid);
  if(!wrap)return;
  try{
    const data=await api('/api/admin/dating/bots/'+encodeURIComponent(uid)+'/photos');
    const photos=data.photos||[];
    if(!photos.length){wrap.innerHTML='<span class="admin-small" style="align-self:center;color:#aaa">Sin fotos aún</span>';return}
    wrap.innerHTML=photos.map(ph=>`<div class="bot-photo-thumb"><img src="${esc(ph.url)}" alt=""><button class="del-ph" title="Eliminar foto" data-del-ph="${esc(ph.id)}" data-del-uid="${esc(uid)}">×</button></div>`).join('');
    wrap.querySelectorAll('[data-del-ph]').forEach(btn=>btn.onclick=async()=>{
      if(!confirm('¿Eliminar esta foto del bot?'))return;
      try{await api('/api/admin/dating/bots/'+encodeURIComponent(btn.dataset.delUid)+'/photos/'+encodeURIComponent(btn.dataset.delPh),{method:'DELETE'});_dtLoadBotPhotos(btn.dataset.delUid)}catch(e){alert(e.message)}
    });
  }catch(e){wrap.innerHTML='<span class="admin-small" style="color:#c00">Error cargando fotos</span>'}
}

function _dtShowBotForm(bot){
  _dtEditingBot=bot?bot.user_id:null;
  const wrap=document.getElementById('bot-form-wrap');
  if(!wrap)return;
  const title=bot?`✏️ Editar bot: ${esc(bot.display_name)}`:'＋ Crear nuevo bot de citas';
  wrap.innerHTML=`<div class="admin-card" style="border:2px solid #4d35ff22;margin-bottom:14px"><h3 style="margin-top:0">${title}</h3>${_dtBotFormHTML(bot)}<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="admin-btn" id="btn-bot-save">${bot?'💾 Guardar cambios':'🚀 Crear bot'}</button><button class="admin-btn secondary" id="btn-bot-cancel">Cancelar</button></div><p id="bot-form-err" class="admin-error"></p></div>`;
  // Intereses tags
  wrap.querySelectorAll('.itag').forEach(tag=>tag.onclick=()=>{
    tag.classList.toggle('sel');
    const sel=[...wrap.querySelectorAll('.itag.sel')].map(t=>t.dataset.int);
    document.getElementById('interests-json-hidden').value=JSON.stringify(sel);
  });
  document.getElementById('btn-bot-cancel').onclick=()=>{wrap.innerHTML='';_dtEditingBot=null};
  document.getElementById('btn-bot-save').onclick=async()=>{
    const data=_dtCollectForm();
    if(!data){return}
    if(!data.display_name||!data.birth_date||!data.gender||!data.looking_for||!data.province){
      document.getElementById('bot-form-err').textContent='Completa los campos obligatorios (*).';return
    }
    try{
      if(_dtEditingBot){
        await api('/api/admin/dating/bots/'+encodeURIComponent(_dtEditingBot),{method:'PUT',body:JSON.stringify(data)});
        alert('Bot actualizado correctamente.');
      }else{
        const res=await api('/api/admin/dating/bots',{method:'POST',body:JSON.stringify(data)});
        alert('Bot creado: '+res.display_name+' ('+res.user_id+')');
      }
      wrap.innerHTML='';_dtEditingBot=null;_dtLoadSub();
    }catch(e){document.getElementById('bot-form-err').textContent=e.message}
  };
  wrap.scrollIntoView({behavior:'smooth',block:'nearest'});
}

_dtLoadSub();

function _bcEsc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function _bcTime(iso){if(!iso)return'';const d=new Date(iso.endsWith('Z')?iso:iso+'Z');return d.toLocaleTimeString('es-CU',{hour:'2-digit',minute:'2-digit',timeZone:'America/Havana'})}
function _bcDateTime(iso){if(!iso)return'';const d=new Date(iso.endsWith('Z')?iso:iso+'Z');return d.toLocaleString('es-CU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'America/Havana'})}
function _bcDateRel(iso){
  if(!iso)return'';
  const d=new Date(iso.endsWith('Z')?iso:iso+'Z'),now=new Date();
  const diff=Math.floor((now-d)/1000);
  if(diff<60)return'ahora';if(diff<3600)return Math.floor(diff/60)+'m';
  if(diff<86400)return Math.floor(diff/3600)+'h';
  if(diff<604800)return Math.floor(diff/86400)+'d';
  return d.toLocaleDateString('es-CU',{day:'2-digit',month:'short',timeZone:'America/Havana'});
}

// ── Cargar conversaciones ────────────────────────────────────────────
async function _bcLoadConvs(){
  const bot=document.getElementById('bc-bot-filter')?.value||'';
  const statusF=document.getElementById('bc-status-filter')?.value||'';
  const search=(document.getElementById('bc-search')?.value||'').trim();
  let url='/api/admin/dating/bots/conversations?limit=60';
  if(bot)url+='&bot_user_id='+encodeURIComponent(bot);
  if(statusF)url+='&status_filter='+encodeURIComponent(statusF);
  if(search)url+='&search='+encodeURIComponent(search);
  const scroll=document.getElementById('bc-list-scroll');
  if(scroll)scroll.innerHTML='<div class="bc-empty"><div class="bc-empty-icon">⌛</div><p>Cargando…</p></div>';
  try{
    const data=await api(url);
    _bcConvs=data.conversations||[];
    const cnt=document.getElementById('bc-count');
    if(cnt)cnt.textContent=_bcConvs.length+' de '+(data.total||0)+' conversaciones';
    _bcRenderList();
  }catch(e){
    const scroll=document.getElementById('bc-list-scroll');
    if(scroll)scroll.innerHTML='<div class="bc-empty" style="color:#ef4444"><div class="bc-empty-icon">⚠️</div><h3>Error al cargar</h3><p>'+_bcEsc(e.message)+'</p><button class="admin-btn secondary" onclick="_bcLoadConvs()" style="margin-top:8px;font-size:12px">Reintentar</button></div>';
  }
}
function _bcRenderList(){
  const wrap=document.getElementById('bc-list-scroll');
  if(!wrap)return;
  if(!_bcConvs.length){
    const hasFilter=document.getElementById('bc-bot-filter')?.value||document.getElementById('bc-status-filter')?.value||document.getElementById('bc-search')?.value;
    wrap.innerHTML='<div class="bc-empty"><div class="bc-empty-icon">'+(hasFilter?'🔍':'💬')+'</div>'
      +'<h3>'+(hasFilter?'Sin resultados':'Sin conversaciones')+'</h3>'
      +'<p>'+(hasFilter?'No hay chats que coincidan con los filtros.<br><a href="#" onclick="document.getElementById(\'bc-bot-filter\').value=\'\';document.getElementById(\'bc-status-filter\').value=\'\';document.getElementById(\'bc-search\').value=\'\';_bcLoadConvs();return false" style="color:#4d35ff">Limpiar filtros</a>':'Aún no hay matches entre usuarios reales y bots de citas.<br>Los chats aparecerán aquí cuando existan matches.')+'</p>'
      +'</div>';
    return;
  }
  wrap.innerHTML='';
  _bcConvs.forEach(conv=>{
    const isActive=conv.match_status==='active';
    const div=document.createElement('div');
    div.className='bc-conv-card'+(conv.match_id===_bcSelMatch?' active':'');
    div.dataset.matchId=conv.match_id;
    const lm=conv.last_message;
    const previewText=lm?(lm.sender_id===conv.bot_id?'🤖 ':'👤 ')+lm.body.slice(0,50):'— sin mensajes —';
    const relTime=lm?_bcDateRel(lm.created_at):_bcDateRel(conv.matched_at);
    div.innerHTML=
      '<div class="bc-names">'
      +'<span class="bc-status-dot '+(isActive?'active':'closed')+'"></span>'
      +_bcEsc(conv.bot_name)
      +' <span style="color:#9ca3af;font-weight:400">↔</span> '
      +_bcEsc(conv.real_name)
      +'</div>'
      +'<div class="bc-preview">'+_bcEsc(previewText)+'</div>'
      +'<div class="bc-ts">'+_bcEsc(relTime)+'</div>'
      +(conv.unread_from_user>0?'<span class="bc-badge">'+conv.unread_from_user+'</span>':'');
    div.onclick=()=>_bcSelectConv(conv);
    wrap.appendChild(div);
  });
}

function _bcMobileSwitch(){

// ── Abrir conversación ───────────────────────────────────────────────
async function _bcOpen(conv){
  if(_bcPoll){clearInterval(_bcPoll);_bcPoll=null}
  _bcSelMatch=conv.match_id;_bcSelConv=conv;_bcLastId=0;
  document.querySelectorAll('.bc-conv-card').forEach(el=>el.classList.toggle('active',parseInt(el.dataset.matchId)===conv.match_id));
  const isActive=conv.match_status==='active';
  // Header
  const hdrTitle=document.querySelector('#bc-chat-info .bc-hdr-title');
  const hdrSub=document.querySelector('#bc-chat-info .bc-hdr-sub');
  const hdrStatus=document.getElementById('bc-chat-status');
  if(hdrTitle)hdrTitle.innerHTML='<span style="color:#818cf8">🤖 '+_bcEsc(conv.bot_name)+'</span> <span style="color:#d1d5db">↔</span> <span>👤 '+_bcEsc(conv.real_name)+'</span>';
  if(hdrSub)hdrSub.innerHTML='Match #'+conv.match_id+' · '+_bcDateTime(conv.matched_at)+(conv.message_count!=null?' · '+conv.message_count+' mensajes':'');
  if(hdrStatus)hdrStatus.innerHTML='<span class="bc-pill '+(isActive?'active':'closed')+'">'+(isActive?'✅ Activo':'⛔ Cerrado')+'</span>'+'<span id="bc-live-dot" style="margin-left:6px;'+(isActive?'':'display:none')+'"></span>';
  // Limpiar mensajes
  const msgs=document.getElementById('bc-msgs');
  if(msgs){msgs.innerHTML='<div class="bc-empty" style="opacity:.5"><div class="bc-empty-icon" style="font-size:24px">⌛</div><p style="font-size:12px">Cargando mensajes…</p></div>'}
  // Formulario
  const bodyEl=document.getElementById('bc-body');
  const sendEl=document.getElementById('bc-send');
  if(bodyEl){bodyEl.disabled=!isActive;bodyEl.value='';if(isActive)bodyEl.placeholder='Escribe la respuesta del bot… (Ctrl+Enter para enviar)';else bodyEl.placeholder='Este match está cerrado — no se pueden enviar mensajes.'}
  if(sendEl){sendEl.disabled=!isActive;sendEl.textContent=isActive?'Enviar como bot':'Cerrado'}
  // Cargar mensajes
  await _bcPoll2(conv);
  if(isActive)_bcPoll=setInterval(()=>_bcPoll2(conv),4000);
}
// ── Polling de mensajes ───────────────────────────────────────────────
async function _bcPoll2(conv){
  if(!_bcSelMatch)return;
  try{
    const data=await api('/api/admin/dating/bots/conversations/'+_bcSelMatch+'/messages?after_id='+_bcLastId+'&limit=60');
    const msgs=document.getElementById('bc-msgs');
    if(msgs&&msgs.querySelector('.bc-empty'))msgs.innerHTML='';
    if(data.messages&&data.messages.length){_bcAppend(data.messages,conv);_bcLastId=data.last_id}
    else if(!_bcLastId&&msgs&&!msgs.children.length){
      msgs.innerHTML='<div class="bc-empty"><div class="bc-empty-icon">🤐</div><h3>Sin mensajes aún</h3><p>Aún no hay mensajes en esta conversación.</p></div>';
    }
    // Actualizar estado del formulario según status devuelto
    const isActive=!data.match_status||data.match_status==='active';
    const bodyEl=document.getElementById('bc-body');const sendEl=document.getElementById('bc-send');
    if(bodyEl)bodyEl.disabled=!isActive;
    if(sendEl){sendEl.disabled=!isActive;sendEl.textContent=isActive?'Enviar como bot':'Cerrado'}
  }catch(_){}
}
// ── Render de mensajes ────────────────────────────────────────────────
function _bcAppend(msgs,conv){
  const area=document.getElementById('bc-msgs');if(!area)return;
  const atBottom=area.scrollHeight-area.scrollTop-area.clientHeight<80;
  let lastDay='';
  msgs.forEach(m=>{
    if(area.querySelector('[data-msg-id="'+m.id+'"]'))return;
    const isBot=m.sender_id===conv.bot_id,isSystem=m.is_system;
    const cls=isSystem?'from-system':(isBot?'from-bot':'from-user');
    // Separador de día
    const msgDay=m.created_at?(new Date((m.created_at.endsWith('Z')?m.created_at:m.created_at+'Z'))).toLocaleDateString('es-CU',{weekday:'long',day:'numeric',month:'long',timeZone:'America/Havana'}):'';
    if(msgDay&&msgDay!==lastDay){
      const sep=document.createElement('div');sep.className='bc-day-sep';sep.innerHTML='<span>'+_bcEsc(msgDay)+'</span>';
      area.appendChild(sep);lastDay=msgDay;
    }
    const row=document.createElement('div');row.className='bc-msg '+cls;row.dataset.msgId=m.id;
    const readIcon=(!isSystem&&isBot&&m.read_at)?'<span style="font-size:9px;opacity:.6" title="Leído '+_bcDateTime(m.read_at)+'"> ✓✓</span>':'';
    row.innerHTML='<div class="bc-bubble">'+_bcEsc(m.body)
      +'<span class="bc-meta">'+_bcTime(m.created_at)+readIcon+'</span>'
      +'</div>';
    area.appendChild(row);
  });
  if(atBottom)area.scrollTop=area.scrollHeight;
}

document.addEventListener('DOMContentLoaded', () => {
  document.addEventListener('click', e => {
    if (e.target.id === 'adImgUploadBtn') document.getElementById('adImgFile')?.click();
  });
  document.addEventListener('change', async e => {
    if (e.target.id !== 'adImgFile') return;
    const file = e.target.files?.[0];
    if (!file) return;
    const btn = document.getElementById('adImgUploadBtn');
    const status = document.getElementById('adImgUploadStatus');
    const preview = document.getElementById('adImgPreview');
    if (btn) btn.disabled = true;
    if (status) status.textContent = 'Subiendo…';
    try {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
      const d = await api('/api/ads/upload-image', { method: 'POST', body: JSON.stringify({ image: b64 }) });
      const inp = document.getElementById('adImg');
      if (inp) inp.value = d.url;
      if (preview) { preview.innerHTML = `<img src="${esc(d.url)}" style="max-height:120px;border-radius:10px;display:block">`; }
      if (status) { status.textContent = '✓ Subida'; setTimeout(() => { if (status) status.textContent = ''; }, 3000); }
    } catch (err) { if (status) status.textContent = err.message; }
    finally { if (btn) btn.disabled = false; }
  });
});
