<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5fb"><title>Administración · LiggaCuba</title><link rel="stylesheet" href="/style.css"><style>
body{background:#f7f5fb}.admin-wrap{max-width:1000px;margin:auto;padding:22px 16px 50px}.admin-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}.admin-head .brand-mark{margin:0;flex:none}.admin-head h1{font-size:22px;margin:0}.admin-head p{margin:4px 0;color:#777184;font-size:12px}.admin-login,.admin-panel,.admin-card{background:white;border-radius:20px;padding:18px;box-shadow:0 8px 25px #2820440d;margin:12px 0}.admin-login{max-width:460px;margin:28px auto}.admin-input{box-sizing:border-box;margin:6px 0 12px}.admin-btn{background:#4d35ff;color:white;padding:11px 14px;border-radius:12px;font-weight:800;border:0;cursor:pointer}.admin-btn.secondary{background:#f0edff;color:#4d35ff}.admin-btn.danger{background:#fff0f2;color:#b4233c}.admin-nav{display:flex;gap:8px;overflow:auto;margin:12px 0}.admin-nav button{white-space:nowrap;background:white;border:1px solid #e7e2f1;padding:10px 13px;border-radius:12px;font-weight:800}.admin-nav button.active{background:#4d35ff;color:white}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.admin-stat{background:#f8f7fc;border-radius:15px;padding:14px}.admin-stat b{font-size:23px;display:block}.admin-stat span{font-size:11px;color:#777184}.admin-table{width:100%;border-collapse:collapse;font-size:12px}.admin-table th,.admin-table td{text-align:left;padding:10px 7px;border-bottom:1px solid #eeeaf5;vertical-align:top;overflow-wrap:anywhere}.admin-table-wrap{overflow:auto}.admin-row{padding:12px 0;border-bottom:1px solid #eeeaf5}.admin-row:last-child{border:0}.admin-small{font-size:11px;color:#777184}.admin-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.admin-actions .admin-btn{font-size:11px;padding:8px 10px}.hidden{display:none!important}.admin-error{color:#b4233c;font-size:12px;min-height:18px}@media(max-width:500px){.admin-wrap{padding:15px 12px}.admin-table{min-width:650px}}
</style></head><body><div class="admin-wrap"><header class="admin-head"><div class="brand-mark">LC</div><div><h1>LiggaCuba · Administración</h1><p>Gestión segura de usuarios, Premium y pagos</p></div></header>
<section id="loginBox" class="admin-login"><h2>Acceso de administrador</h2><p class="admin-small">Usa ADMIN_KEY de Railway para entrar por primera vez o las credenciales de un administrador creado.</p><label>Usuario (administradores secundarios)</label><input id="loginUser" class="admin-input" autocomplete="username" placeholder="Usuario"><label>Contraseña</label><input id="loginPass" class="admin-input" type="password" autocomplete="current-password" placeholder="Contraseña"><label>ADMIN_KEY principal (dejar vacío si usas usuario)</label><input id="masterKey" class="admin-input" type="password" autocomplete="current-password" placeholder="Clave principal de Railway"><button id="loginBtn" class="admin-btn">Entrar</button><p id="loginError" class="admin-error"></p></section>
<section id="panel" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b id="whoami">Administrador</b><div class="admin-small">Las acciones importantes quedan registradas.</div></div><button id="logout" class="admin-btn secondary">Cerrar sesión</button></div><nav class="admin-nav"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="users">Usuarios / Premium</button><button data-tab="payments">Pagos</button><button data-tab="admins">Administradores</button><button data-tab="audit">Historial</button></nav><div id="content"></div></section></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let token=sessionStorage.getItem('lc_admin_token')||'',perms=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(path,{...opts,headers});const d=await r.json().catch(()=>({detail:'Respuesta inválida'}));if(!r.ok)throw Error(d.detail||'Error');return d}
async function login(){const err=$('#loginError');err.textContent='';try{const master=$('#masterKey').value.trim();const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#loginUser').value.trim(),password:$('#loginPass').value,master_key:master})});token=d.token;perms=d.permissions||[];sessionStorage.setItem('lc_admin_token',token);syncAdminNav();$('#masterKey').value='';sessionStorage.removeItem('lc_master_key');$('#loginBox').classList.add('hidden');$('#panel').classList.remove('hidden');$('#whoami').textContent=d.username==='owner'?'Administrador principal':d.username;await showTab('dashboard')}catch(e){err.textContent=e.message}}
function can(p){return perms.includes(p)}
function syncAdminNav(){$$('.admin-nav button').forEach(b=>{const need={users:'users',payments:'payments',admins:'admins',audit:'audit',dashboard:'stats'}[b.dataset.tab];b.classList.toggle('hidden',!!need&&!can(need))})}
async function showTab(tab){$$('.admin-nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const c=$('#content');c.innerHTML='<div class="admin-card">Cargando…</div>';try{if(tab==='dashboard'){const d=await api('/api/admin/stats');c.innerHTML=`<h2>Dashboard</h2><div class="admin-grid">${[['Usuarios registrados',d.total_users],['Premium activo',d.premium_users],['Uso de hoy',d.today_usage],['Pagos pendientes',d.pending_payments]].map(x=>`<div class="admin-stat"><b>${esc(x[1])}</b><span>${x[0]}</span></div>`).join('')}</div><div class="admin-card"><b>Consejo de seguridad</b><p class="admin-small">Verifica el ingreso real antes de aprobar una transferencia manualmente.</p></div>`}
else if(tab==='users'){const d=await api('/api/admin/users');c.innerHTML=`<h2>Usuarios y Premium</h2><input id="userSearch" class="admin-input" placeholder="Buscar por ID, nombre o username"><div id="userRows"></div>`;const draw=items=>$('#userRows').innerHTML=items.map(u=>`<div class="admin-row"><b>${esc(u.first_name||u.username||'Usuario')} · ${esc(u.user_id)}</b><div class="admin-small">@${esc(u.username||'—')} · Teléfono: ${esc(u.payment_phone||'—')}<br>Premium: ${u.premium?'Activo':'Inactivo'} · Vence: ${esc(u.premium_until||'—')}</div>${can('premium')?`<div class="admin-actions"><button class="admin-btn" data-prem="grant" data-uid="${esc(u.user_id)}">Activar 7 días</button><button class="admin-btn secondary" data-prem="extend" data-uid="${esc(u.user_id)}">Extender 7 días</button><button class="admin-btn danger" data-prem="revoke" data-uid="${esc(u.user_id)}">Retirar Premium</button></div>`:''}</div>`).join('')||'<p>Sin usuarios.</p>';draw(d.items);$('#userSearch').oninput=()=>draw(d.items.filter(u=>[u.user_id,u.username,u.first_name].some(v=>String(v||'').toLowerCase().includes($('#userSearch').value.toLowerCase()))));$$('[data-prem]').forEach(b=>b.onclick=async()=>{if(!confirm(`¿Confirmas ${b.dataset.prem} Premium para ${b.dataset.uid}?`))return;try{await api('/api/admin/premium',{method:'POST',body:JSON.stringify({user_id:b.dataset.uid,action:b.dataset.prem,days:7})});alert('Premium actualizado');await showTab('users')}catch(e){alert(e.message)}})}
else if(tab==='payments'){const d=await api('/api/admin/payments');c.innerHTML=`<h2>Pagos recientes</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Operación</th><th>Usuario</th><th>Método</th><th>Importe</th><th>Estado</th><th>Fecha</th><th>Acción</th></tr></thead><tbody>${d.items.map(p=>`<tr><td>${esc(p.operation_id)}</td><td>${esc(p.user_id)}</td><td>${esc(p.payment_method||'—')}</td><td>${esc(p.amount)}</td><td>${esc(p.status)}</td><td>${esc(p.created_at)}</td><td>${can('payments')&&['pending','proof_submitted'].includes(p.status)?`<button class="admin-btn" data-verify="${esc(p.operation_id)}">Verificar</button><button class="admin-btn danger" data-reject="${esc(p.operation_id)}">Rechazar</button>`:'—'}</td></tr>`).join('')}</tbody></table></div><p class="admin-small">Verificar un pago concede el Premium del plan asociado. Confirma primero que el dinero fue recibido.</p>`;$$('[data-verify]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Confirmaste el ingreso real del dinero y deseas activar Premium?'))return;try{await api('/api/admin/payments/verify',{method:'POST',body:JSON.stringify({operation_id:b.dataset.verify,user_id:''})});alert('Pago verificado');showTab('payments')}catch(e){alert(e.message)}});$$('[data-reject]').forEach(b=>b.onclick=async()=>{const reason=prompt('Motivo del rechazo (opcional):')??null;if(reason===null)return;try{await api('/api/admin/payments/reject',{method:'POST',body:JSON.stringify({operation_id:b.dataset.reject,action:'reject',reason})});showTab('payments')}catch(e){alert(e.message)}})}
else if(tab==='admins'){if(!can('admins')){c.innerHTML='<div class="admin-card">No tienes permiso para administrar cuentas.</div>';return}const d=await api('/api/admin/admins');c.innerHTML=`<h2>Administradores</h2><div class="admin-card"><h3>Crear administrador</h3><label>Usuario</label><input id="newUser" class="admin-input" placeholder="usuario"><label>Contraseña (mínimo 10 caracteres)</label><input id="newPass" class="admin-input" type="password"><p><label><input type="checkbox" value="users" class="perm" checked> Usuarios</label> <label><input type="checkbox" value="premium" class="perm" checked> Premium</label> <label><input type="checkbox" value="payments" class="perm"> Pagos</label> <label><input type="checkbox" value="stats" class="perm"> Estadísticas</label> <label><input type="checkbox" value="audit" class="perm"> Historial</label></p><button id="createAdmin" class="admin-btn">Crear administrador</button></div><h3>Administradores existentes</h3>${d.items.map(a=>`<div class="admin-row"><b>${esc(a.username)}</b><div class="admin-small">Permisos: ${esc(a.permissions.join(', '))} · ${a.is_active?'Activo':'Desactivado'}</div>${a.is_active?`<button class="admin-btn danger" data-disable="${esc(a.username)}">Desactivar</button>`:''}</div>`).join('')}`;$('#createAdmin').onclick=async()=>{try{const permissions=$$('.perm:checked').map(x=>x.value);await api('/api/admin/admins',{method:'POST',body:JSON.stringify({username:$('#newUser').value,password:$('#newPass').value,permissions})});alert('Administrador creado');showTab('admins')}catch(e){alert(e.message)}};$$('[data-disable]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Desactivar este administrador?'))return;try{await api('/api/admin/admins/status',{method:'POST',body:JSON.stringify({username:b.dataset.disable,is_active:false})});showTab('admins')}catch(e){alert(e.message)}})}
else if(tab==='audit'){if(!can('audit')){c.innerHTML='<div class="admin-card">No tienes permiso para consultar el historial.</div>';return}const d=await api('/api/admin/audit');c.innerHTML=`<h2>Historial administrativo</h2>${d.items.map(a=>`<div class="admin-row"><b>${esc(a.action)}</b><div class="admin-small">${esc(a.created_at)} · ${esc(a.actor)} · Objetivo: ${esc(a.target)}</div><pre style="white-space:pre-wrap;font-size:11px">${esc(a.details)}</pre></div>`).join('')||'<p>Sin acciones registradas.</p>'}`}}
catch(e){c.innerHTML=`<div class="admin-card">${esc(e.message)}</div>`}}
$('#loginBtn').onclick=login;$('#logout').onclick=()=>{token='';perms=[];sessionStorage.removeItem('lc_admin_token');sessionStorage.removeItem('lc_master_key');$('#panel').classList.add('hidden');$('#loginBox').classList.remove('hidden')};$$('.admin-nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));if(token){api('/api/admin/me').then(d=>{perms=d.permissions||[];syncAdminNav();$('#loginBox').classList.add('hidden');$('#panel').classList.remove('hidden');$('#whoami').textContent=d.username==='owner'?'Administrador principal':d.username;showTab('dashboard')}).catch(()=>{token='';sessionStorage.removeItem('lc_admin_token')})}
</script></body></html>
