<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5fb"><title>Administración · LiggaCuba</title><link rel="stylesheet" href="/style.css"><style>
body{background:#f7f5fb}.admin-wrap{max-width:1000px;margin:auto;padding:22px 16px 50px}.admin-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}.admin-head .brand-mark{margin:0;flex:none}.admin-head h1{font-size:22px;margin:0}.admin-head p{margin:4px 0;color:#777184;font-size:12px}.admin-login,.admin-panel,.admin-card{background:white;border-radius:20px;padding:18px;box-shadow:0 8px 25px #2820440d;margin:12px 0}.admin-login{max-width:460px;margin:28px auto}.admin-input{box-sizing:border-box;margin:6px 0 12px}.admin-btn{background:#4d35ff;color:white;padding:11px 14px;border-radius:12px;font-weight:800;border:0;cursor:pointer}.admin-btn.secondary{background:#f0edff;color:#4d35ff}.admin-btn.danger{background:#fff0f2;color:#b4233c}.admin-nav{display:flex;gap:8px;overflow:auto;margin:12px 0}.admin-nav button{white-space:nowrap;background:white;border:1px solid #e7e2f1;padding:10px 13px;border-radius:12px;font-weight:800}.admin-nav button.active{background:#4d35ff;color:white}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.admin-stat{background:#f8f7fc;border-radius:15px;padding:14px}.admin-stat b{font-size:23px;display:block}.admin-stat span{font-size:11px;color:#777184}.admin-table{width:100%;border-collapse:collapse;font-size:12px}.admin-table th,.admin-table td{text-align:left;padding:10px 7px;border-bottom:1px solid #eeeaf5;vertical-align:top;overflow-wrap:anywhere}.admin-table-wrap{overflow:auto}.admin-row{padding:12px 0;border-bottom:1px solid #eeeaf5}.admin-row:last-child{border:0}.admin-small{font-size:11px;color:#777184}.admin-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.admin-actions .admin-btn{font-size:11px;padding:8px 10px}.hidden{display:none!important}.admin-error{color:#b4233c;font-size:12px;min-height:18px}@media(max-width:500px){.admin-wrap{padding:15px 12px}.admin-table{min-width:650px}}
</style></head><body><div class="admin-wrap"><header class="admin-head"><div class="brand-mark">LC</div><div><h1>LiggaCuba · Administración</h1><p>Gestión segura de usuarios, Premium y pagos</p><a href="/" style="font-size:12px">← Volver a LiggaCuba</a></div></header>
<section id="loginBox" class="admin-login"><h2>Acceso de administrador</h2><p class="admin-small">Usa ADMIN_KEY de Railway para entrar por primera vez o las credenciales de un administrador creado.</p><label>Usuario (administradores secundarios)</label><input id="loginUser" class="admin-input" autocomplete="username" placeholder="Usuario"><label>Contraseña</label><input id="loginPass" class="admin-input" type="password" autocomplete="current-password" placeholder="Contraseña"><label>ADMIN_KEY principal (dejar vacío si usas usuario)</label><input id="masterKey" class="admin-input" type="password" autocomplete="current-password" placeholder="Clave principal de Railway"><button id="loginBtn" class="admin-btn">Entrar</button><p id="loginError" class="admin-error"></p></section>
<section id="panel" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b id="whoami">Administrador</b><div class="admin-small">Las acciones importantes quedan registradas.</div></div><button id="logout" class="admin-btn secondary">Cerrar sesión</button></div><nav class="admin-nav"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="users">Usuarios / Premium</button><button data-tab="payments">Pagos</button><button data-tab="admins">Administradores</button><button data-tab="audit">Historial</button><button data-tab="ai-monitor">Monitor de IA</button><button data-tab="providers">Proveedores IA</button></nav><div id="content"></div></section></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let token=sessionStorage.getItem('lc_admin_token')||'';if(!token&&localStorage.getItem('lc_admin_token')){token=localStorage.getItem('lc_admin_token');sessionStorage.setItem('lc_admin_token',token)}localStorage.removeItem('lc_admin_token');let perms=[];const fmtCubaDate=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('es-CU',{timeZone:'America/Havana',dateStyle:'short',timeStyle:'medium'}).format(d)};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(path,{...opts,headers});const d=await r.json().catch(()=>({detail:'Respuesta inválida'}));if(!r.ok)throw Error(d.detail||'Error');return d}
async function login(){const err=$('#loginError');err.textContent='';try{const master=$('#masterKey').value.trim();const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#loginUser').value.trim(),password:$('#loginPass').value,master_key:master})});token=d.token;perms=d.permissions||[];sessionStorage.setItem('lc_admin_token',token);syncAdminNav();$('#masterKey').value='';sessionStorage.removeItem('lc_master_key');$('#loginBox').classList.add('hidden');$('#panel').classList.remove('hidden');$('#whoami').textContent=d.is_owner?'Administrador principal':d.username;await showTab('dashboard')}catch(e){err.textContent=e.message}}
function can(p){return perms.includes(p)}
function syncAdminNav(){$$('.admin-nav button').forEach(b=>{const need={users:'users',payments:'payments',admins:'admins',audit:'audit',dashboard:'stats','ai-monitor':'ai_analytics',providers:'settings'}[b.dataset.tab];b.classList.toggle('hidden',!!need&&!can(need))})}
async function showTab(tab){$$('.admin-nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const c=$('#content');c.innerHTML='<div class="admin-card">Cargando…</div>';try{if(tab==='dashboard'){const d=await api('/api/admin/stats');c.innerHTML=`<h2>Dashboard</h2><div class="admin-grid">${[['Usuarios registrados',d.total_users],['Premium activo',d.premium_users],['Uso de hoy',d.today_usage],['Pagos pendientes',d.pending_payments]].map(x=>`<div class="admin-stat"><b>${esc(x[1])}</b><span>${x[0]}</span></div>`).join('')}</div><div class="admin-card"><b>Consejo de seguridad</b><p class="admin-small">Verifica el ingreso real antes de aprobar una transferencia manualmente.</p></div>`}
else if(tab==='users'){const d=await api('/api/admin/users');c.innerHTML=`<h2>Usuarios y Premium</h2><input id="userSearch" class="admin-input" placeholder="Buscar por ID, nombre o username"><div id="userRows"></div>`;const draw=items=>$('#userRows').innerHTML=items.map(u=>`<div class="admin-row"><b>${esc(u.first_name||u.username||'Usuario')} · ${esc(u.user_id)}</b><div class="admin-small">@${esc(u.username||'—')} · Teléfono: ${esc(u.payment_phone||'—')}<br>Premium: ${u.premium?'Activo':'Inactivo'} · Vence: ${esc(fmtCubaDate(u.premium_until))}</div>${can('premium')?`<div class="admin-actions"><button class="admin-btn" data-prem="grant" data-uid="${esc(u.user_id)}">Activar 7 días</button><button class="admin-btn secondary" data-prem="extend" data-days="7" data-uid="${esc(u.user_id)}">Extender 7 días</button><button class="admin-btn secondary" data-prem="extend" data-days="365" data-uid="${esc(u.user_id)}">Extender 1 año</button><button class="admin-btn danger" data-prem="revoke" data-uid="${esc(u.user_id)}">Retirar Premium</button></div>`:''}</div>`).join('')||'<p>Sin usuarios.</p>';draw(d.items);$('#userSearch').oninput=()=>draw(d.items.filter(u=>[u.user_id,u.username,u.first_name].some(v=>String(v||'').toLowerCase().includes($('#userSearch').value.toLowerCase()))));$$('[data-prem]').forEach(b=>b.onclick=async()=>{if(!confirm(`¿Confirmas ${b.dataset.prem} Premium para ${b.dataset.uid}?`))return;try{await api('/api/admin/premium',{method:'POST',body:JSON.stringify({user_id:b.dataset.uid,action:b.dataset.prem,days:Number(b.dataset.days||7)})});alert('Premium actualizado');await showTab('users')}catch(e){alert(e.message)}})}
else if(tab==='payments'){const d=await api('/api/admin/payments');c.innerHTML=`<h2>Pagos recientes</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Operación</th><th>Usuario</th><th>Método</th><th>Importe</th><th>Estado</th><th>Fecha</th><th>Acción</th></tr></thead><tbody>${d.items.map(p=>`<tr><td>${esc(p.operation_id)}</td><td>${esc(p.user_id)}</td><td>${esc(p.payment_method||'—')}</td><td>${esc(p.amount)}</td><td>${esc(p.status)}</td><td>${esc(fmtCubaDate(p.created_at))}</td><td>${can('payments')&&['pending','proof_submitted'].includes(p.status)?`<button class="admin-btn" data-verify="${esc(p.operation_id)}">Verificar</button><button class="admin-btn danger" data-reject="${esc(p.operation_id)}">Rechazar</button>`:'—'}</td></tr>`).join('')}</tbody></table></div><p class="admin-small">Verificar un pago concede el Premium del plan asociado. Confirma primero que el dinero fue recibido.</p>`;$$('[data-verify]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Confirmaste el ingreso real del dinero y deseas activar Premium?'))return;try{await api('/api/admin/payments/verify',{method:'POST',body:JSON.stringify({operation_id:b.dataset.verify,user_id:''})});alert('Pago verificado');showTab('payments')}catch(e){alert(e.message)}});$$('[data-reject]').forEach(b=>b.onclick=async()=>{const reason=prompt('Motivo del rechazo (opcional):')??null;if(reason===null)return;try{await api('/api/admin/payments/reject',{method:'POST',body:JSON.stringify({operation_id:b.dataset.reject,action:'reject',reason})});showTab('payments')}catch(e){alert(e.message)}})}
else if(tab==='admins'){if(!can('admins')){c.innerHTML='<div class="admin-card">No tienes permiso para administrar cuentas.</div>';return}const d=await api('/api/admin/admins');c.innerHTML=`<h2>Administradores</h2><div class="admin-card"><h3>Crear administrador</h3><label>Usuario</label><input id="newUser" class="admin-input" placeholder="usuario"><label>Contraseña (mínimo 10 caracteres)</label><input id="newPass" class="admin-input" type="password"><p><label><input type="checkbox" value="users" class="perm" checked> Usuarios</label> <label><input type="checkbox" value="premium" class="perm" checked> Premium</label> <label><input type="checkbox" value="payments" class="perm"> Pagos</label> <label><input type="checkbox" value="stats" class="perm"> Estadísticas</label> <label><input type="checkbox" value="audit" class="perm"> Historial</label> <label><input type="checkbox" value="ai_analytics" class="perm"> Monitor de IA</label></p><button id="createAdmin" class="admin-btn">Crear administrador</button></div><h3>Administradores existentes</h3>${d.items.map(a=>`<div class="admin-row"><b>${esc(a.username)}</b><div class="admin-small">Permisos: ${esc(a.permissions.join(', '))} · ${a.is_active?'Activo':'Desactivado'}</div>${a.is_active?`<button class="admin-btn danger" data-disable="${esc(a.username)}">Desactivar</button>`:''}</div>`).join('')}`;$('#createAdmin').onclick=async()=>{try{const permissions=$$('.perm:checked').map(x=>x.value);await api('/api/admin/admins',{method:'POST',body:JSON.stringify({username:$('#newUser').value,password:$('#newPass').value,permissions})});alert('Administrador creado');showTab('admins')}catch(e){alert(e.message)}};$$('[data-disable]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Desactivar este administrador?'))return;try{await api('/api/admin/admins/status',{method:'POST',body:JSON.stringify({username:b.dataset.disable,is_active:false})});showTab('admins')}catch(e){alert(e.message)}})}
else if(tab==='ai-monitor'){
if(!can('ai_analytics')){c.innerHTML='<div class="admin-card">No tienes permiso para consultar el monitor de IA.</div>';return}
const d=await api('/api/admin/ai-monitor'),s=d.summary;
const stat=(label,value)=>`<div class="admin-stat"><b>${esc(value)}</b><span>${label}</span></div>`;
const pct=(n,total)=>total?Math.round(n*100/total):0;
c.innerHTML=`<h2>Monitor de IA</h2><p class="admin-small">${esc(d.quality_note)}</p>
<div class="admin-grid">${stat('Generaciones de hoy',s.today_events)}${stat('Éxitos',s.successes)}${stat('Errores',s.failures)}${stat('Tasa de éxito',s.success_rate+'%')}${stat('Usuarios activos hoy',s.unique_users)}${stat('Latencia media',s.avg_latency_ms+' ms')}${stat('Calidad estimada media',s.avg_quality+'/100')}</div>
<div class="admin-card"><h3>Actividad reciente (7 días)</h3><div style="display:flex;gap:8px;align-items:end;height:130px;border-bottom:1px solid #eee;padding:8px 0">${d.days.map(day=>`<div title="${esc(day.day)}: ${day.successes||0} éxitos, ${day.failures||0} errores" style="flex:1;min-width:18px;text-align:center"><div style="height:${Math.max(3,Math.min(100,(Number(day.successes||0)+Number(day.failures||0))*8))}px;background:#4d35ff;border-radius:5px 5px 0 0"></div><div class="admin-small">${esc(String(day.day||'').slice(5))}</div></div>`).join('')||'<span class="admin-small">Aún no hay datos de generaciones.</span>'}</div><p class="admin-small">Las barras muestran el volumen relativo de eventos por día; el color representa volumen total, no calidad. Tokens consumidos y costes monetarios no se muestran porque los adaptadores actuales no exponen métricas de uso uniformes; no se estiman cifras sin datos.</p></div>
<div class="admin-card"><h3>Proveedores y modelos</h3><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Proveedor</th><th>Modelo</th><th>Total</th><th>Éxito</th><th>Fallos</th><th>Latencia media</th><th>Calidad est.</th></tr></thead><tbody>${d.providers.map(p=>`<tr><td>${esc(p.provider)}</td><td>${esc(p.model)}</td><td>${p.total}</td><td>${p.successes}</td><td>${p.failures}</td><td>${p.avg_latency} ms</td><td>${p.avg_quality}/100</td></tr>`).join('')||'<tr><td colspan="7">Sin datos. Se rellenará con generaciones registradas tras esta actualización.</td></tr>'}</tbody></table></div></div>
<div class="admin-card"><h3>Usuarios IA</h3><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Usuario</th><th>Modelo reciente</th><th>Proveedor</th><th>Intentos restantes hoy</th><th>Análisis totales</th><th>Generaciones</th><th>Éxito</th><th>Errores</th><th>Calidad est.</th></tr></thead><tbody>${d.users.map(u=>`<tr><td>${esc(u.display_name)}${u.premium?' · Premium':''}</td><td>${esc(u.last_model||'—')}</td><td>${esc(u.last_provider||'—')}</td><td>${u.premium?'Premium':u.remaining_attempts}</td><td>${u.total_analyses}</td><td>${u.total_attempts}</td><td>${u.success_rate}%</td><td>${u.failures}</td><td>${u.avg_quality?u.avg_quality+'/100':'—'}</td></tr>`).join('')||'<tr><td colspan="9">Sin usuarios registrados.</td></tr>'}</tbody></table></div><p class="admin-small">El límite restante es una estimación del cupo gratuito diario. Los reintentos son por análisis y se registran como eventos separados.</p></div>
<div class="admin-card"><h3>Últimos eventos y errores</h3><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Fecha</th><th>Usuario</th><th>Proveedor / modelo</th><th>Estado</th><th>Categoría del error</th><th>Latencia</th><th>Score est.</th><th>Reintento</th></tr></thead><tbody>${d.events.map(e=>`<tr><td>${esc(fmtCubaDate(e.created_at))}</td><td>${esc(e.display_name)}</td><td>${esc(e.provider)} / ${esc(e.model)}</td><td>${esc(e.status)}</td><td>${esc(e.error_code||'—')}</td><td>${e.latency_ms} ms</td><td>${e.quality_score==null?'—':e.quality_score+'/100'}</td><td>${e.retry_number?'Sí':'No'}</td></tr>`).join('')||'<tr><td colspan="8">Todavía no hay eventos. No se incluyen capturas, mensajes, respuestas ni claves.</td></tr>'}</tbody></table></div></div>`;
}
else if(tab==='providers'){
if(!can('settings')){c.innerHTML='<div class="admin-card">Solo el administrador principal puede gestionar proveedores y claves.</div>';return}
const d=await api('/api/admin/ai-providers');
c.innerHTML=`<h2>Proveedores de IA</h2><div class="admin-card"><p class="admin-small">Las claves se cifran en el servidor y nunca vuelven a mostrarse. Para guardar claves configura <b>AI_PROVIDER_ENCRYPTION_KEY</b> (mínimo 32 caracteres) en Railway. Solo se admiten endpoints HTTPS compatibles con OpenAI.</p><p class="admin-small">Cargar un proveedor para probarlo puede consumir cuota o generar un pequeño coste.</p><form id="providerForm"><label>ID único (ej. proveedor-gratis)</label><input id="providerId" class="admin-input" required pattern="[a-zA-Z0-9_-]+" maxlength="48" placeholder="mi-proveedor"><label>Nombre visible</label><input id="providerName" class="admin-input" required maxlength="80" placeholder="Mi proveedor"><label>Base URL HTTPS (ej. https://api.example.com/v1)</label><input id="providerUrl" class="admin-input" required type="url" placeholder="https://api.example.com/v1"><label>Modelo</label><input id="providerModel" class="admin-input" required maxlength="200" placeholder="nombre-del-modelo"><label>Clave API (se deja vacía para conservar la existente)</label><input id="providerKey" class="admin-input" type="password" autocomplete="new-password" placeholder="No se vuelve a mostrar"><label>Prioridad (1–1000; menor número se intenta primero)</label><input id="providerPriority" class="admin-input" type="number" min="1" max="1000" value="50" required><p><label><input id="providerText" type="checkbox" checked> Texto</label> <label><input id="providerImage" type="checkbox"> Imagen (solo si el modelo la admite)</label> <label><input id="providerEnabled" type="checkbox" checked> Activado</label></p><button class="admin-btn" type="submit">Guardar proveedor</button><button class="admin-btn secondary" id="providerClear" type="button">Limpiar</button><p id="providerMessage" class="admin-small"></p></form></div><div class="admin-card"><h3>Proveedores integrados</h3><div class="admin-small">Gemini, Groq, OpenRouter y Cohere siguen configurados por variables de entorno.</div><pre style="white-space:pre-wrap;font-size:11px">${esc(JSON.stringify(d.built_in,null,2))}</pre></div><h3>Proveedores adicionales</h3>${d.items.map(p=>`<div class="admin-row"><b>${esc(p.name)} · ${esc(p.provider_id)}</b><div class="admin-small">Modelo: ${esc(p.model)} · Prioridad: ${p.priority} · ${p.enabled?'Activo':'Desactivado'} · Texto: ${p.supports_text?'Sí':'No'} · Imagen: ${p.supports_image?'Sí':'No'} · Clave guardada: ${p.has_api_key?'Sí':'No'}<br>Prueba: ${esc(p.last_test_status||'No probada')} · ${esc(p.last_error_category||'')} · ${esc(fmtCubaDate(p.last_test_at))}</div><div class="admin-actions"><button class="admin-btn secondary" data-test-provider="${esc(p.provider_id)}">Probar conexión</button><button class="admin-btn secondary" data-edit-provider="${esc(p.provider_id)}">Editar</button><button class="admin-btn danger" data-delete-provider="${esc(p.provider_id)}">Eliminar</button></div></div>`).join('')||'<p>No hay proveedores adicionales todavía.</p>'}`;
const clearProviderForm=()=>{$('#providerForm').reset();$('#providerId').disabled=false;$('#providerPriority').value='50';$('#providerText').checked=true;$('#providerEnabled').checked=true;$('#providerMessage').textContent=''};
$('#providerClear').onclick=clearProviderForm;
$('#providerForm').onsubmit=async ev=>{ev.preventDefault();$('#providerMessage').textContent='Guardando…';try{await api('/api/admin/ai-providers',{method:'POST',body:JSON.stringify({provider_id:$('#providerId').value,name:$('#providerName').value,base_url:$('#providerUrl').value,model:$('#providerModel').value,api_key:$('#providerKey').value,supports_text:$('#providerText').checked,supports_image:$('#providerImage').checked,enabled:$('#providerEnabled').checked,priority:Number($('#providerPriority').value)})});$('#providerMessage').textContent='Guardado. La clave no se muestra ni se devuelve.';await showTab('providers')}catch(e){$('#providerMessage').textContent=e.message}};
$$('[data-test-provider]').forEach(b=>b.onclick=async()=>{b.disabled=true;const old=b.textContent;b.textContent='Probando…';try{const r=await api('/api/admin/ai-providers/'+encodeURIComponent(b.dataset.testProvider)+'/test',{method:'POST',body:'{}'});alert(r.ok?`Conexión correcta · ${r.latency_ms} ms · modelo ${r.model}`:`Prueba fallida · ${r.error_category||'error de conexión'}`);await showTab('providers')}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent=old}});
$$('[data-edit-provider]').forEach(b=>b.onclick=()=>{const p=d.items.find(x=>x.provider_id===b.dataset.editProvider);if(!p)return;$('#providerId').value=p.provider_id;$('#providerId').disabled=true;$('#providerName').value=p.name;$('#providerUrl').value=p.base_url.replace(/\/chat\/completions$/,'');$('#providerModel').value=p.model;$('#providerKey').value='';$('#providerPriority').value=p.priority;$('#providerText').checked=!!p.supports_text;$('#providerImage').checked=!!p.supports_image;$('#providerEnabled').checked=!!p.enabled;$('#providerMessage').textContent='Clave vacía: se conserva la clave cifrada actual.';$('#providerForm').scrollIntoView({behavior:'smooth'})});
$$('[data-delete-provider]').forEach(b=>b.onclick=async()=>{if(!confirm(`¿Eliminar la configuración de ${b.dataset.deleteProvider}?`))return;try{await api('/api/admin/ai-providers/'+encodeURIComponent(b.dataset.deleteProvider),{method:'DELETE'});await showTab('providers')}catch(e){alert(e.message)}});
}
else if(tab==='audit'){if(!can('audit')){c.innerHTML='<div class="admin-card">No tienes permiso para consultar el historial.</div>';return}const d=await api('/api/admin/audit');c.innerHTML=`<h2>Historial administrativo</h2>${d.items.map(a=>`<div class="admin-row"><b>${esc(a.action)}</b><div class="admin-small">${esc(fmtCubaDate(a.created_at))} · ${esc(a.actor)} · Objetivo: ${esc(a.target)}</div><pre style="white-space:pre-wrap;font-size:11px">${esc(a.details)}</pre></div>`).join('')||'<p>Sin acciones registradas.</p>'}`}}
catch(e){c.innerHTML=`<div class="admin-card">${esc(e.message)}</div>`}}
$('#loginBtn').onclick=login;$('#logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST',body:'{}'})}catch(_){}token='';perms=[];sessionStorage.removeItem('lc_admin_token');localStorage.removeItem('lc_admin_token');sessionStorage.removeItem('lc_master_key');$('#panel').classList.add('hidden');$('#loginBox').classList.remove('hidden')};$$('.admin-nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));if(token){api('/api/admin/me').then(d=>{perms=d.permissions||[];syncAdminNav();$('#loginBox').classList.add('hidden');$('#panel').classList.remove('hidden');$('#whoami').textContent=d.is_owner?'Administrador principal':d.username;showTab('dashboard')}).catch(()=>{token='';sessionStorage.removeItem('lc_admin_token');localStorage.removeItem('lc_admin_token')})}
</script></body></html>
